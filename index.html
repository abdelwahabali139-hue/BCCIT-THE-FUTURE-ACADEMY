<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>BCCIT THE FUTURE ACADEMY</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:Tahoma,Arial,sans-serif}
  #academy{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071321}
  #advisor-launch{display:none!important;position:fixed;z-index:10001;right:18px;bottom:18px;border:1px solid #48d9ef;background:linear-gradient(135deg,#07364b,#101d38);color:#fff;border-radius:999px;padding:13px 19px;font-size:15px;font-weight:700;box-shadow:0 8px 28px #0008;cursor:pointer}
  #advisor-panel{display:none;position:fixed;z-index:10002;right:16px;bottom:78px;width:min(390px,calc(100vw - 32px));height:min(540px,calc(100dvh - 110px));background:#0b1728;color:#f4fbff;border:1px solid #39cde5;border-radius:18px;box-shadow:0 18px 55px #000b;overflow:hidden;direction:rtl}
  #advisor-panel.open{display:flex;flex-direction:column}
  .advisor-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(120deg,#0c3850,#142343);border-bottom:1px solid #28617b}
  .advisor-title{font-weight:700;font-size:16px}
  .advisor-subtitle{font-size:11px;color:#a9d9e8;margin-top:4px}
  #advisor-close{border:0;background:#ffffff18;color:white;border-radius:9px;padding:7px 10px;font-size:18px;cursor:pointer}
  #advisor-messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:94%;padding:11px 13px;border-radius:13px;line-height:1.65;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.bot{align-self:flex-start;background:#142b43;border:1px solid #244b69}
  .msg.user{align-self:flex-end;background:#07566a;border:1px solid #168ca4}
  .msg.error{border-color:#9d4d57;color:#ffd9dc}
  .advisor-compose{padding:12px;border-top:1px solid #24445d;background:#091321}
  #advisor-question{width:100%;resize:none;min-height:76px;max-height:130px;border:1px solid #315b73;border-radius:12px;background:#101f32;color:#fff;padding:11px;font:14px Tahoma,Arial;outline:none}
  #advisor-question:focus{border-color:#4bd9ee}
  .advisor-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
  .advisor-hint{font-size:10px;color:#9bb5c5}
  #advisor-send{border:0;border-radius:10px;background:linear-gradient(120deg,#13a9bd,#2866a6);color:white;font-weight:700;padding:10px 20px;cursor:pointer}
  #advisor-send:disabled{opacity:.55;cursor:wait}
  @media(max-width:520px){
    #advisor-panel{right:8px;bottom:68px;width:calc(100vw - 16px);height:min(500px,calc(100dvh - 86px))}
  }
</style>
</head>
<body>
<iframe id="academy" src="BCCIT_THE_FUTURE_ACADEMY_V14_INTEGRATED.html" title="BCCIT THE FUTURE ACADEMY" allow="fullscreen"></iframe>

<button id="advisor-launch" type="button" aria-expanded="false" aria-controls="advisor-panel">✦ اسأل المستشار التعليمي</button>

<section id="advisor-panel" role="dialog" aria-label="المستشار التعليمي الذكي" aria-modal="false">
  <header class="advisor-head">
    <div>
      <div class="advisor-title">المستشار التعليمي الذكي</div>
      <div class="advisor-subtitle">BCCIT THE FUTURE ACADEMY</div>
    </div>
    <button id="advisor-close" type="button" aria-label="إغلاق">×</button>
  </header>
  <div id="advisor-messages" aria-live="polite">
    <div class="msg bot">مرحبًا بك في BCCIT THE FUTURE ACADEMY 👋
اكتب سؤالك عن الدورات أو المهارات أو المسار التدريبي المناسب لك، وسأساعدك.</div>
  </div>
  <form class="advisor-compose" id="advisor-form">
    <textarea id="advisor-question" maxlength="1500" placeholder="اكتب سؤالك هنا..." aria-label="اكتب سؤالك للمستشار" required></textarea>
    <div class="advisor-actions">
      <span class="advisor-hint">حتى 1500 حرف</span>
      <button id="advisor-send" type="submit">إرسال السؤال</button>
    </div>
  </form>
</section>

<script>
(function(){
  const launch=document.getElementById('advisor-launch');
  const panel=document.getElementById('advisor-panel');
  const close=document.getElementById('advisor-close');
  const form=document.getElementById('advisor-form');
  const input=document.getElementById('advisor-question');
  const send=document.getElementById('advisor-send');
  const messages=document.getElementById('advisor-messages');

  function toggle(open){
    panel.classList.toggle('open',open);
    launch.setAttribute('aria-expanded',String(open));
    if(open) input.focus();
  }
  function addMessage(text,kind){
    const el=document.createElement('div');
    el.className='msg '+kind;
    el.textContent=text;
    messages.appendChild(el);
    messages.scrollTop=messages.scrollHeight;
    return el;
  }
  // Place the existing advisor launcher directly beneath the existing advisor portrait inside the academy iframe.
  const academy=document.getElementById('academy');
  function installInlineAdvisorButton(){
    try{
      const doc=academy.contentDocument;
      if(!doc) return;
      const photo=doc.querySelector('#advisor .avatar.advisor-photo');
      if(!photo || doc.getElementById('bccit-advisor-inline')) return;
      const column=doc.createElement('div');
      column.className='bccit-advisor-photo-column';
      const style=doc.createElement('style');
      style.textContent='.bccit-advisor-photo-column{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;min-width:0}.bccit-advisor-photo-column #bccit-advisor-inline{width:100%;border:1px solid #48d9ef;background:linear-gradient(135deg,#07364b,#101d38);color:#fff;border-radius:12px;padding:10px 6px;font:700 12px Tahoma,Arial,sans-serif;line-height:1.5;box-shadow:0 6px 18px #0006;cursor:pointer}.bccit-advisor-photo-column #bccit-advisor-inline:focus-visible{outline:2px solid #f4c96a;outline-offset:3px}';
      doc.head.appendChild(style);
      photo.parentNode.insertBefore(column,photo);
      column.appendChild(photo);
      const button=doc.createElement('button');
      button.id='bccit-advisor-inline';
      button.type='button';
      button.textContent='✦ اسأل المستشار التعليمي';
      button.setAttribute('aria-label','افتح نافذة المستشار التعليمي');
      button.addEventListener('click',()=>window.parent.postMessage({type:'BCCIT_OPEN_ADVISOR'},location.origin));
      column.appendChild(button);
    }catch(error){
      // Keep the academy usable if browser security or a delayed frame prevents injection.
    }
  }
  academy.addEventListener('load',installInlineAdvisorButton);
  if(academy.contentDocument && academy.contentDocument.readyState==='complete') installInlineAdvisorButton();
  window.addEventListener('message',event=>{
    if(event.origin===location.origin && event.data && event.data.type==='BCCIT_OPEN_ADVISOR') toggle(true);
  });
  launch.addEventListener('click',()=>toggle(!panel.classList.contains('open')));
  close.addEventListener('click',()=>toggle(false));
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    const question=input.value.trim();
    if(!question)return;
    addMessage(question,'user');
    input.value='';
    input.disabled=true;
    send.disabled=true;
    send.textContent='جارٍ الإرسال...';
    const waiting=addMessage('أراجع سؤالك الآن، لحظة من فضلك...','bot');
    try{
      const response=await fetch('/.netlify/functions/assistant',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:question})
      });
      const data=await response.json().catch(()=>({}));
      waiting.remove();
      if(!response.ok){
        const message=response.status===500 && data.error==='OPENAI_API_KEY is not configured'
          ? 'خدمة المستشار الذكي قيد الإعداد حاليًا. يمكنك استخدام الاختيارات الخمسة وفتح الكتالوج، أو المحاولة لاحقًا.'
          : (data.error||'تعذر الوصول إلى المستشار الآن. حاول مرة أخرى لاحقًا.');
        addMessage(message,'bot error');
      }else{
        addMessage(data.answer||'لم تصل إجابة واضحة. حاول مرة أخرى.','bot');
      }
    }catch(error){
      waiting.remove();
      addMessage('تعذر الاتصال بخدمة المستشار. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.','bot error');
    }finally{
      input.disabled=false;
      send.disabled=false;
      send.textContent='إرسال السؤال';
      input.focus();
    }
  });
})();
</script>
</body>
</html>
